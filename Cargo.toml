[workspace]
members = ["crates/claude-sync-core", "crates/claude-sync-cli", "crates/claude-sync-gui"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/user/claude-sync"
description = "Select, back up, and share Claude Code configuration via zip bundles or LAN P2P"

[workspace.dependencies]
claude-sync-core = { path = "crates/claude-sync-core" }
serde = { version = "1", features = ["derive"] }
# settings.json을 다시 쓸 때 키 순서를 보존한다.
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "2"
sha2 = "0.10"
glob = "0.3"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
dialoguer = "0.11"
indicatif = "0.17"
console = "0.15"
dirs = "6"
hostname = "0.4"
zip = { version = "=9.0.5", default-features = false, features = ["deflate"] }
spake2 = "0.4"
chacha20poly1305 = "0.10"
hkdf = "0.12"
rand = "0.8"
